<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Palashi, 23 June 1757 — schematic</title>
  <desc>
    Original schematic drawn for the Historical Documentary Engine.
    North is up. The Bhagirathi is a diagram on the west side of the field;
    the river has changed course since 23 June 1757.
    The mango grove is Clive's attested defensive area.
    The Nawab's camp is the attested area north of the grove, toward Murshidabad.
    The ditch and the hunting lodge are traditional landmarks, placed approximately.
    This plate contains no troop-movement arrows. Movement is supplied by the scene
    file and is drawn there as illustrative.
    Do not replace this file with a scanned or traced published map.
  </desc>
